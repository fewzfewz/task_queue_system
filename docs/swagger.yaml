basePath: /
definitions:
  dto.CreateJobRequest:
    properties:
      max_retries:
        description: MaxRetries defaults to 3 if omitted (zero value).
        type: integer
      payload:
        additionalProperties: true
        description: Payload is an arbitrary map of key/value pairs specific to the
          job type.
        type: object
      priority:
        description: Priority is optional, defaults to "medium"
        type: string
      type:
        description: Type must match one of the registered handler types (e.g. "email",
          "image").
        type: string
    type: object
  dto.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  dto.JobResponse:
    properties:
      correlation_id:
        type: string
      created_at:
        type: string
      error_history:
        items:
          $ref: '#/definitions/jobs.AttemptError'
        type: array
      id:
        type: string
      max_retries:
        type: integer
      payload:
        additionalProperties: true
        type: object
      priority:
        type: string
      retries:
        type: integer
      status:
        type: string
      tenant_id:
        type: string
      timeout:
        type: integer
      type:
        type: string
      updated_at:
        type: string
      run_at:
        type: string
      version:
        type: integer
    type: object
  jobs.AttemptError:
    properties:
      attempt:
        type: integer
      error:
        type: string
      timestamp:
        type: string
    type: object
  queue.QueueMetrics:
    properties:
      active_jobs:
        type: integer
      completed_jobs:
        type: integer
      failed_jobs:
        type: integer
      total_jobs:
        type: integer
    type: object
host: localhost:8080
info:
  contact: {}
  description: A distributed task queue API for enqueuing and monitoring jobs.
  title: Task Queue API
  version: "1.0"
paths:
  /jobs:
    post:
      consumes:
      - application/json
      description: Submits a job to the queue for asynchronous execution.
      parameters:
      - description: Job Creation Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateJobRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.JobResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Create a new job
      tags:
      - jobs
  /jobs/{id}:
    get:
      description: Retrieves the current execution status and metadata of a specific
        job by ID.
      parameters:
      - description: Job ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.JobResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Get job status
      tags:
      - jobs
  /workers:
    get:
      description: Retrieves a list of all currently active worker instances and their
        last heartbeat timestamp.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: array
            items:
              $ref: '#/definitions/queue.WorkerInfo'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Get active workers
      tags:
      - metrics
  /admin/dlq:
    get:
      description: Renders the HTML dead letter queue management console.
      produces:
      - text/html
      responses:
        "200":
          description: OK
      summary: Get DLQ admin console
      tags:
      - dlq
  /api/v1/dlq:
    get:
      description: Returns a paginated list of jobs that have permanently failed for the tenant.
      parameters:
      - in: query
        name: queue
        type: string
      - in: query
        name: limit
        type: integer
      - in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: array
            items:
              $ref: '#/definitions/dto.JobResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: List failed jobs
      tags:
      - dlq
    delete:
      description: Deletes all failed jobs for a tenant/queue that are older than the specified timestamp.
      parameters:
      - in: query
        name: queue
        type: string
      - in: query
        name: older_than
        type: string
        required: true
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
            additionalProperties:
              type: integer
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Bulk purge failed jobs
      tags:
      - dlq
  /api/v1/dlq/{id}:
    get:
      description: Returns the full state of a failed job, including its error history.
      parameters:
      - in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.JobResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Get failed job details
      tags:
      - dlq
    delete:
      description: Permanently deletes a single failed job record from the store.
      parameters:
      - in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Purge a failed job
      tags:
      - dlq
  /api/v1/dlq/{id}/replay:
    post:
      description: Resets a failed job to pending state and enqueues it for immediate retry.
      parameters:
      - in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.JobResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Re-enqueue a failed job
      tags:
      - dlq
  /metrics:
    get:
      description: Retrieves system-wide execution statistics including totals, active
        jobs, and failure counts.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/queue.QueueMetrics'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Get queue metrics
      tags:
      - metrics
  /swagger/:
    get:
      description: Swagger UI for the API.
      responses:
        "200":
          description: OK
      summary: Swagger UI
      tags:
      - docs
swagger: "2.0"
