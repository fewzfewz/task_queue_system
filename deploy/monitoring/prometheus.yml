global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: task-queue-api
    static_configs:
      - targets: ['api:8080']
        labels:
          service: api

  - job_name: task-queue-worker
    static_configs:
      - targets: ['worker:8081']
        labels:
          service: worker

  - job_name: task-queue-scheduler
    static_configs:
      - targets: ['scheduler:8082']
        labels:
          service: scheduler
