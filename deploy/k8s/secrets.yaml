# DO NOT APPLY THIS FILE TO PRODUCTION.
#
# The values are intentionally empty so that applying it fails closed: pods
# start with empty credentials (and their secretKeyRef env resolves to an empty
# value) instead of a known default. Create the real secret imperatively with
# `kubectl create secret` — see README-production.md §3.2.
#
# This secret holds the API-key-only credentials. The Postgres connection
# string and password live in the `task-queue-postgres` secret (keys
# `conn-str`, `password`).
apiVersion: v1
kind: Secret
metadata:
  name: task-queue-secrets
  namespace: task-queue
type: Opaque
stringData:
  api-key: ""
  admin-password: ""
