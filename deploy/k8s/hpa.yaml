apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: task-queue-worker-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: task-queue-worker
  minReplicas: 2
  maxReplicas: 20
  metrics:
    # 1. Scale up based on external task queue length via Prometheus Adapter
    - type: External
      external:
        metric:
          name: task_queue_length
        target:
          type: AverageValue
          averageValue: 100
    # 2. Scale down when the worker busy ratio drops below 0.2
    - type: External
      external:
        metric:
          name: task_queue_worker_busy_ratio
        target:
          type: Value
          value: "0.2"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
