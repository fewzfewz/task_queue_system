apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-queue-scheduler
  namespace: task-queue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: task-queue-scheduler
  template:
    metadata:
      labels:
        app: task-queue-scheduler
    spec:
      serviceAccountName: task-queue-scheduler
      containers:
        - name: scheduler
          image: task-queue-scheduler:latest
          imagePullPolicy: IfNotPresent
          command: ["./scheduler"]
          env:
            - name: SCHEDULER_PORT
              value: "8082"
            - name: REDIS_HOST
              value: "redis.task-queue.svc.cluster.local:6379"
            - name: REDIS_PASSWORD
              value: ""
            - name: REDIS_DB
              value: "0"
            - name: POSTGRES_CONN_STR
              valueFrom:
                secretKeyRef:
                  name: task-queue-postgres
                  key: conn-str
          ports:
            - containerPort: 8082
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 2
