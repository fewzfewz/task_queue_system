#
# Production ingress for the task queue API.
#
# Before applying:
# - Replace `api.task-queue.example.com` with your real public host.
# - Confirm the cert-manager ClusterIssuer name matches your cluster
#   (this manifest uses `letsencrypt-prod`).
#
# If cert-manager is not installed yet, install it first:
# https://cert-manager.io/docs/installation/
#
# Apply with:
#   kubectl apply -f deploy/k8s/ingress.yaml
#
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: task-queue-api
  namespace: task-queue
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.task-queue.example.com
      secretName: task-queue-tls
  rules:
    - host: api.task-queue.example.com
      http:
        paths:
          - path: /healthz
            pathType: Prefix
            backend:
              service:
                name: task-queue-api
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: task-queue-api
                port:
                  number: 8080
