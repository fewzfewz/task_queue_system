apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: task-queue-default-deny
  namespace: task-queue
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: task-queue-api-ingress
  namespace: task-queue
spec:
  podSelector:
    matchLabels:
      app: task-queue-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: task-queue-redis-ingress
  namespace: task-queue
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: task-queue-api
        - podSelector:
            matchLabels:
              app: task-queue-worker
        - podSelector:
            matchLabels:
              app: task-queue-scheduler
      ports:
        - port: 6379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: task-queue-egress-redis
  namespace: task-queue
spec:
  podSelector:
    matchLabels:
      app: task-queue-api
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - port: 6379
