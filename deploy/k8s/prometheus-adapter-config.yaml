# Prometheus Adapter ConfigMap Snippet
# Add this rules section to your prometheus-adapter configuration (usually values.yaml for Helm)
rules:
  external:
    - seriesQuery: '{__name__="task_queue_length"}'
      resources:
        template: <<.Resource>>
      name:
        as: "task_queue_length"
      metricsQuery: "sum(task_queue_length{<<.LabelMatchers>>}) by (queue, tenant_id)"

    - seriesQuery: '{__name__="task_queue_worker_busy_ratio"}'
      resources:
      name:
        as: "worker_busy_ratio"
      metricsQuery: "avg_over_time(task_queue_worker_busy_ratio[3m])"
