apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-queue-worker
  namespace: task-queue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: task-queue-worker
  template:
    metadata:
      labels:
        app: task-queue-worker
    spec:
      serviceAccountName: task-queue-worker
      containers:
        - name: worker
          image: task-queue-worker:latest
          imagePullPolicy: IfNotPresent
          command: ["./worker"]
          env:
            - name: WORKER_PORT
              value: "8081"
            - name: REDIS_HOST
              value: "redis.task-queue.svc.cluster.local:6379"
            - name: REDIS_PASSWORD
              value: ""
            - name: REDIS_DB
              value: "0"
            - name: WORKER_POOL_SIZE
              value: "50"
            - name: DRAIN_TIMEOUT
              value: "60"
          ports:
            - containerPort: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 2
          lifecycle:
            preStop:
              exec:
                command:
                  [
                    "/bin/sh",
                    "-c",
                    "sleep 5 && curl -X POST localhost:8081/healthz/shutdown",
                  ]
