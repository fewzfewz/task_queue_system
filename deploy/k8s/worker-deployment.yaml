apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-queue-worker
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: task-queue-worker
  template:
    metadata:
      labels:
        app: task-queue-worker
    spec:
      containers:
        - name: worker
          image: task-queue-worker:latest
          imagePullPolicy: IfNotPresent
          command: ["./worker"]
          env:
            - name: PORT
              value: "8080"
          ports:
            - containerPort: 8080
          lifecycle:
            preStop:
              exec:
                command:
                  [
                    "/bin/sh",
                    "-c",
                    "sleep 5 && curl -X POST localhost:8080/healthz/shutdown",
                  ]
