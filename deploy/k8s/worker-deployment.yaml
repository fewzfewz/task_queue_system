apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-queue-worker
  namespace: task-queue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: task-queue-worker
  template:
    metadata:
      labels:
        app: task-queue-worker
    spec:
      serviceAccountName: task-queue-worker
      terminationGracePeriodSeconds: 75
      containers:
        - name: worker
          image: task-queue-worker:latest
          imagePullPolicy: IfNotPresent
          command: ["./worker"]
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: WORKER_PORT
              value: "8081"
            - name: REDIS_HOST
              value: "redis.task-queue.svc.cluster.local:6379"
            - name: REDIS_PASSWORD
              value: ""
            - name: REDIS_DB
              value: "0"
            - name: WORKER_POOL_SIZE
              value: "50"
            - name: DRAIN_TIMEOUT
              value: "60"
            - name: POSTGRES_CONN_STR
              valueFrom:
                secretKeyRef:
                  name: task-queue-postgres
                  key: conn-str
          ports:
            - containerPort: 8081
              name: http
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 2
          lifecycle:
            preStop:
              exec:
                command:
                  ["/bin/sh", "-c", "sleep 5"]
