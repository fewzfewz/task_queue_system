apiVersion: v1
kind: ServiceAccount
metadata:
  name: task-queue-api
  namespace: task-queue
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: task-queue-worker
  namespace: task-queue
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: task-queue-scheduler
  namespace: task-queue
automountServiceAccountToken: false
---
# API: reads the API-key credentials (task-queue-secrets) and the Postgres
# connection string (task-queue-postgres).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: task-queue-api-secrets
  namespace: task-queue
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["task-queue-secrets", "task-queue-postgres"]
    verbs: ["get"]
---
# Worker/scheduler: read only the Postgres connection string.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: task-queue-postgres-secrets
  namespace: task-queue
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["task-queue-postgres"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: task-queue-configmap-reader
  namespace: task-queue
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: task-queue-api-api-secrets
  namespace: task-queue
subjects:
  - kind: ServiceAccount
    name: task-queue-api
    namespace: task-queue
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: task-queue-api-secrets
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: task-queue-worker-postgres-secrets
  namespace: task-queue
subjects:
  - kind: ServiceAccount
    name: task-queue-worker
    namespace: task-queue
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: task-queue-postgres-secrets
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: task-queue-scheduler-postgres-secrets
  namespace: task-queue
subjects:
  - kind: ServiceAccount
    name: task-queue-scheduler
    namespace: task-queue
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: task-queue-postgres-secrets
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: task-queue-worker-configmap-reader
  namespace: task-queue
subjects:
  - kind: ServiceAccount
    name: task-queue-worker
    namespace: task-queue
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: task-queue-configmap-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: task-queue-scheduler-configmap-reader
  namespace: task-queue
subjects:
  - kind: ServiceAccount
    name: task-queue-scheduler
    namespace: task-queue
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: task-queue-configmap-reader
