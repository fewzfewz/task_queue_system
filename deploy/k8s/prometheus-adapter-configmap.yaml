apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-adapter-config
  namespace: monitoring
data:
  config.yaml: |
    rules:
      external:
        - seriesQuery: '{__name__="task_queue_length"}'
          resources:
            template: <<.Resource>>
          name:
            as: "task_queue_length"
          metricsQuery: 'sum(task_queue_length{<<.LabelMatchers>>})'

        - seriesQuery: '{__name__="task_queue_worker_busy_ratio"}'
          resources:
            template: <<.Resource>>
          name:
            as: "task_queue_worker_busy_ratio"
          metricsQuery: 'avg(task_queue_worker_busy_ratio{<<.LabelMatchers>>})'

        - seriesQuery: '{__name__="task_queue_api_request_rate"}'
          resources:
            template: <<.Resource>>
          name:
            as: "task_queue_api_request_rate"
          metricsQuery: 'sum(rate(task_queue_api_request_total{<<.LabelMatchers>>}[5m]))'
