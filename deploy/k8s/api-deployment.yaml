apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-queue-api
  namespace: task-queue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: task-queue-api
  template:
    metadata:
      labels:
        app: task-queue-api
    spec:
      serviceAccountName: task-queue-api
      containers:
        - name: api
          image: task-queue-api:latest
          imagePullPolicy: IfNotPresent
          command: ["./api"]
          env:
            - name: PORT
              value: "8080"
            - name: REDIS_HOST
              value: "redis.default.svc.cluster.local:6379"
            - name: REDIS_PASSWORD
              value: ""
            - name: REDIS_DB
              value: "0"
            - name: STORE_BACKEND
              value: "redis"
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: task-queue-secrets
                  key: api-key
            - name: WORKER_POOL_SIZE
              value: "50"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 2
