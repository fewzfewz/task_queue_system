apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-queue-api
  namespace: task-queue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: task-queue-api
  template:
    metadata:
      labels:
        app: task-queue-api
    spec:
      serviceAccountName: task-queue-api
      containers:
        - name: api
          image: task-queue-api:latest
          imagePullPolicy: IfNotPresent
          command: ["./api"]
          env:
            - name: PORT
              value: "8080"
            - name: REDIS_HOST
              value: "redis.task-queue.svc.cluster.local:6379"
            - name: REDIS_PASSWORD
              value: ""
            - name: REDIS_DB
              value: "0"
            - name: STORE_BACKEND
              value: "redis"
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: task-queue-secrets
                  key: api-key
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: task-queue-secrets
                  key: admin-password
            - name: POSTGRES_CONN_STR
              valueFrom:
                secretKeyRef:
                  name: task-queue-postgres
                  key: conn-str
            - name: WORKER_POOL_SIZE
              value: "50"
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 2
