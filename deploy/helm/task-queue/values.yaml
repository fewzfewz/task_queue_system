# Default values for task-queue.
# This is a YAML-formatted file.

namespace: task-queue

global:
  imageRegistry: ""
  imagePullSecrets: []

images:
  pullPolicy: IfNotPresent
  tags:
    api: task-queue-api:latest
    worker: task-queue-worker:latest
    scheduler: task-queue-scheduler:latest
    redis: redis:7-alpine

serviceAccount:
  create: true
  name: ""

networking:
  apiPort: 8080
  workerPort: 8081
  schedulerPort: 8082
  redisPort: 6379

resources:
  api:
    requests:
      cpu: 250m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  worker:
    requests:
      cpu: 500m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi
  scheduler:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  redis:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

replicas:
  api: 2
  worker: 3
  scheduler: 1
  redis: 1

autoscaling:
  enabled: true
  api:
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilization: 70
    targetMemoryUtilization: 80

hpa:
  api:
    minReplicas: 2
    maxReplicas: 10
    targetCPU: 70
    targetMemory: 80
    targetRequestRate: 100

env:
  API_KEY: "secret-api-key"
  LOG_LEVEL: info
  REDIS_HOST: ""
  REDIS_DB: "0"
  JOB_RATE_LIMIT: "0"
  MAX_QUEUE_SIZE: "10000"
  STORE_BACKEND: redis
  WORKER_POOL_SIZE: "50"
  DRAIN_TIMEOUT: "60"
  TENANT_RATE_LIMIT: "0"
  SLA_TARGET_SECONDS: "5"
  OTEL_EXPORTER_OTLP_ENDPOINT: ""

ingress:
  enabled: true
  host: api.task-queue.example.com
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"

tls:
  enabled: true
  secretName: task-queue-tls

certificate:
  enabled: true
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer

postgres:
  enabled: false
  connStr: ""

redis:
  persistence:
    enabled: true
    size: 5Gi
    storageClass: ""
  auth:
    enabled: false
    password: ""

networkPolicy:
  enabled: true

metrics:
  enabled: true

pdb:
  api:
    minAvailable: 1
  worker:
    minAvailable: 1
  scheduler:
    minAvailable: 1

topologySpreadConstraints:
  api:
    maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
  worker:
    maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
  scheduler:
    maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
