apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-queue-scheduler
  namespace: {{ include "task-queue.namespace" . }}
  labels:
    app: task-queue-scheduler
spec:
  replicas: {{ .Values.replicas.scheduler }}
  selector:
    matchLabels:
      app: task-queue-scheduler
  template:
    metadata:
      labels:
        app: task-queue-scheduler
    spec:
      serviceAccountName: task-queue-scheduler
      topologySpreadConstraints:
        - maxSkew: {{ .Values.topologySpreadConstraints.scheduler.maxSkew }}
          topologyKey: {{ .Values.topologySpreadConstraints.scheduler.topologyKey }}
          whenUnsatisfiable: {{ .Values.topologySpreadConstraints.scheduler.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              app: task-queue-scheduler
      containers:
        - name: scheduler
          image: {{ include "task-queue.scheduler.image" . }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          env:
            - name: REDIS_HOST
              value: "{{ .Values.env.REDIS_HOST | default (printf "redis.%s.svc.cluster.local:6379" (include "task-queue.namespace" .)) }}"
            - name: REDIS_DB
              value: "{{ .Values.env.REDIS_DB }}"
            - name: LOG_LEVEL
              value: "{{ .Values.env.LOG_LEVEL }}"
            - name: SCHEDULER_PORT
              value: "{{ .Values.networking.schedulerPort }}"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "{{ .Values.env.OTEL_EXPORTER_OTLP_ENDPOINT }}"
          ports:
            - containerPort: {{ .Values.networking.schedulerPort }}
              name: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.networking.schedulerPort }}
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ .Values.networking.schedulerPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources.scheduler | nindent 12 }}
