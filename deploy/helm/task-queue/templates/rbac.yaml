apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: task-queue-api-secrets
  namespace: {{ include "task-queue.namespace" . }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["task-queue-secrets", "task-queue-postgres"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: task-queue-postgres-secrets
  namespace: {{ include "task-queue.namespace" . }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["task-queue-postgres"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: task-queue-configmap-reader
  namespace: {{ include "task-queue.namespace" . }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: task-queue-api-api-secrets
  namespace: {{ include "task-queue.namespace" . }}
subjects:
  - kind: ServiceAccount
    name: task-queue-api
    namespace: {{ include "task-queue.namespace" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: task-queue-api-secrets
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: task-queue-worker-postgres-secrets
  namespace: {{ include "task-queue.namespace" . }}
subjects:
  - kind: ServiceAccount
    name: task-queue-worker
    namespace: {{ include "task-queue.namespace" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: task-queue-postgres-secrets
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: task-queue-scheduler-postgres-secrets
  namespace: {{ include "task-queue.namespace" . }}
subjects:
  - kind: ServiceAccount
    name: task-queue-scheduler
    namespace: {{ include "task-queue.namespace" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: task-queue-postgres-secrets
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: task-queue-worker-configmap-reader
  namespace: {{ include "task-queue.namespace" . }}
subjects:
  - kind: ServiceAccount
    name: task-queue-worker
    namespace: {{ include "task-queue.namespace" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: task-queue-configmap-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: task-queue-scheduler-configmap-reader
  namespace: {{ include "task-queue.namespace" . }}
subjects:
  - kind: ServiceAccount
    name: task-queue-scheduler
    namespace: {{ include "task-queue.namespace" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: task-queue-configmap-reader
