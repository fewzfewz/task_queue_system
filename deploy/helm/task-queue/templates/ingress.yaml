{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: task-queue-api
  namespace: {{ include "task-queue.namespace" . }}
  annotations:
    {{- range $key, $value := .Values.ingress.annotations }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /healthz
            pathType: Prefix
            backend:
              service:
                name: task-queue-api
                port:
                  number: {{ .Values.networking.apiPort }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: task-queue-api
                port:
                  number: {{ .Values.networking.apiPort }}
{{- end }}
