version: '3.8'

services:
  # Centralized Redis serves as both the Queue Broker and the Shared Job Store (Stateless DB)
  redis:
    image: redis:7-alpine
    container_name: task_queue_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - task_queue_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # API Service - Ingests jobs and provides monitoring
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: task_queue_api
    command: ["./api"]
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - REDIS_HOST=redis:6379
      - REDIS_PASSWORD=
      - REDIS_DB=0
      - API_KEY=secret-api-key
      - WORKER_ADDR=worker:8081
      - STORE_BACKEND=redis
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - task_queue_net
    restart: on-failure

  # Worker Service - Scalable consumer group
  # These are fully stateless; scaling them up increases throughput linearily.
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    # container_name omitted to allow multiple instances (replicas)
    command: ["./worker"]
    environment:
      - REDIS_HOST=redis:6379
      - REDIS_PASSWORD=
      - REDIS_DB=0
      - WORKER_POOL_SIZE=50
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - task_queue_net
    deploy:
      mode: replicated
      replicas: 3
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    restart: always

  # Scheduler Service - Moves due jobs from delayed set to active queues
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: task_queue_scheduler
    command: ["./scheduler"]
    environment:
      - REDIS_HOST=redis:6379
      - REDIS_PASSWORD=
      - REDIS_DB=0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - task_queue_net
    restart: always

volumes:
  redis_data:

networks:
  task_queue_net:
    driver: bridge
